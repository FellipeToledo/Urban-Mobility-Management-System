server:
  port: 8080
spring:
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    password:
    url: jdbc:h2:mem:mobilitydb
  jpa:
    open-in-view: false # Prevents the "Open Session In View" anti-pattern
    hibernate:
      ddl-auto: update # Options: none, update, create, create-drop, validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true # Set to false in production for performance
        format_sql: true # Formats SQL in logs for readability

  h2:
    console:
      enabled: true
      path: /h2-console
